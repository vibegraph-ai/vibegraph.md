<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <style>
    .eyebrow { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: 2.2px; fill: #a1a1aa; font-weight: 500; }
    .title   { font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 700; fill: #18181b; }
    .sub     { font-size: 13px; fill: #71717a; }
    .cardtitle { font-size: 15px; font-weight: 600; fill: #18181b; }
    .row     { font-size: 13.5px; font-weight: 600; fill: #27272a; }
    .rowsub  { font-size: 11.5px; fill: #71717a; }
    .chip    { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 9.5px; letter-spacing: 1.6px; fill: #52525b; font-weight: 500; }
    .mono    { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .card { fill: #ffffff; stroke: #e4e4e7; stroke-width: 1; }
    .hair { stroke: #e4e4e7; stroke-width: 1; }
    .orbitchip { fill: #fafafa; stroke: #e4e4e7; stroke-width: 1; }
  </style>

  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- ============ left: the person's vibegraph ============ -->
  <text x="48" y="76" class="eyebrow">ONE PERSON'S VIBEGRAPH</text>
  <rect x="48" y="90" width="330" height="600" rx="18" class="card"/>

  <text x="76" y="132" class="title" font-size="20">Jordan Lee</text>
  <text x="76" y="152" class="sub">jordan-lee.vibegraph.md</text>

  <!-- core identity mini card -->
  <rect x="76" y="176" width="274" height="150" rx="12" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="94" y="204" class="cardtitle">Core Identity</text>
  <line x1="94" y1="218" x2="332" y2="218" class="hair"/>
  <text x="94" y="242" class="row">Personality</text>
  <text x="94" y="259" class="rowsub">Big Five + Enneagram</text>
  <text x="94" y="284" class="row">Ikigai</text>
  <text x="94" y="301" class="rowsub">the founder's own Why lives here</text>

  <!-- personal brand mini card -->
  <rect x="76" y="346" width="274" height="88" rx="12" class="card"/>
  <text x="94" y="374" class="cardtitle">Personal brand</text>
  <text x="94" y="394" class="rowsub">jordan-lee.brand.md</text>
  <text x="94" y="411" class="rowsub">Context · 12, Visuals · 8</text>

  <!-- business brands stubs pointing right -->
  <rect x="76" y="454" width="274" height="60" rx="12" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="94" y="480" class="row">Business brand: Acme Studio</text>
  <text x="94" y="498" class="rowsub">acme-studio.brand.md</text>

  <rect x="76" y="526" width="274" height="44" rx="12" fill="none" stroke="#d4d4d8" stroke-dasharray="4 4"/>
  <text x="94" y="553" class="rowsub">+ every business Jordan owns</text>

  <text x="76" y="640" class="rowsub">Built after the identity and personal</text>
  <text x="76" y="657" class="rowsub">brand: the founder is the raw material.</text>

  <!-- connector from business stub to the big card -->
  <g stroke="#18181b" stroke-width="1.5" fill="none">
    <path d="M 350 484 H 430"/>
  </g>
  <path d="M 430 484 l -8 -4.5 v 9 z" fill="#18181b"/>

  <!-- ============ right: the business brand, magnified ============ -->
  <text x="430" y="76" class="eyebrow">A BUSINESS BRAND, MAGNIFIED</text>
  <rect x="430" y="90" width="722" height="600" rx="18" class="card"/>

  <!-- file bar -->
  <rect x="458" y="116" width="666" height="40" rx="8" fill="#18181b"/>
  <text x="478" y="141" class="mono" font-size="12.5" fill="#ffffff">acme-studio.brand.md</text>
  <text x="648" y="141" class="mono" font-size="12.5" fill="#8f8f96">| kind: business · one file per brand</text>

  <!-- foundations column -->
  <text x="458" y="192" class="eyebrow">FOUNDATIONS · INSTRUMENTS SWAPPED</text>
  <rect x="458" y="204" width="316" height="250" rx="12" class="card"/>

  <text x="476" y="232" class="row">Brand personality</text>
  <text x="476" y="250" class="rowsub">Aaker's five dimensions: Sincerity,</text>
  <text x="476" y="266" class="rowsub">Excitement, Competence,</text>
  <text x="476" y="282" class="rowsub">Sophistication, Ruggedness</text>
  <line x1="476" y1="298" x2="756" y2="298" class="hair"/>

  <text x="476" y="322" class="row">Brand character</text>
  <text x="476" y="340" class="rowsub">one Jungian archetype to speak from</text>
  <line x1="476" y1="356" x2="756" y2="356" class="hair"/>

  <text x="476" y="380" class="row">Purpose</text>
  <text x="476" y="398" class="rowsub">Golden Circle: Why / How / What</text>
  <text x="476" y="414" class="rowsub">+ mission, vision, values</text>
  <text x="476" y="437" class="chip">REPLACES BIG FIVE + IKIGAI</text>

  <!-- structure column -->
  <text x="806" y="192" class="eyebrow">STRUCTURE · SAME AS PERSONAL</text>
  <rect x="806" y="204" width="318" height="250" rx="12" class="card"/>

  <text x="824" y="232" class="row">Brand Context</text>
  <text x="824" y="250" class="rowsub">the same twelve elements, in the</text>
  <text x="824" y="266" class="rowsub">company's voice: UVP, values, tone,</text>
  <text x="824" y="282" class="rowsub">messaging, boilerplates, presence</text>
  <line x1="824" y1="298" x2="1106" y2="298" class="hair"/>

  <text x="824" y="322" class="row">Brand Visuals</text>
  <text x="824" y="340" class="rowsub">the same eight elements, deepened</text>
  <text x="824" y="356" class="rowsub">into a full design system + templates</text>
  <text x="824" y="372" class="rowsub">for what the business ships repeatedly</text>
  <text x="824" y="437" class="chip">CARRIES OVER FROM PERSONAL</text>

  <!-- business orbits strip -->
  <text x="458" y="500" class="eyebrow">BUSINESS ORBITS · BUILT FOR REPEATABILITY</text>
  <rect x="458" y="512" width="666" height="120" rx="12" class="card"/>

  <rect x="476" y="530" width="60" height="30" rx="8" class="orbitchip"/>
  <text x="506" y="549" text-anchor="middle" class="rowsub" fill="#52525b">CRM</text>
  <rect x="548" y="530" width="90" height="30" rx="8" class="orbitchip"/>
  <text x="593" y="549" text-anchor="middle" class="rowsub" fill="#52525b">Finances</text>
  <rect x="650" y="530" width="100" height="30" rx="8" class="orbitchip"/>
  <text x="700" y="549" text-anchor="middle" class="rowsub" fill="#52525b">Operations</text>
  <rect x="762" y="530" width="130" height="30" rx="8" class="orbitchip"/>
  <text x="827" y="549" text-anchor="middle" class="rowsub" fill="#52525b">SOPs &amp; playbooks</text>
  <rect x="904" y="530" width="130" height="30" rx="8" class="orbitchip"/>
  <text x="969" y="549" text-anchor="middle" class="rowsub" fill="#52525b">Brand templates</text>
  <rect x="1046" y="530" width="60" height="30" rx="8" class="orbitchip"/>
  <text x="1076" y="549" text-anchor="middle" class="rowsub" fill="#52525b">Goals</text>

  <text x="476" y="590" class="rowsub">Any operator (teammate, contractor, or agent) following the same playbook produces the</text>
  <text x="476" y="607" class="rowsub">same result. An SOP written for a new hire is most of the way to a protocol an agent can run.</text>

  <!-- shared Why spine -->
  <g stroke="#a1a1aa" stroke-width="1.2" fill="none" stroke-dasharray="5 4">
    <path d="M 350 290 H 404 V 388 H 470"/>
  </g>
  <circle cx="350" cy="290" r="3" fill="#a1a1aa"/>
  <path d="M 470 388 l -7 -4 v 8 z" fill="#a1a1aa"/>
  <text x="404" y="352" text-anchor="middle" class="chip" transform="rotate(-90 404 352)">THE SAME WHY</text>
  <text x="458" y="666" class="rowsub" font-style="italic">The founder's Why and the company's Why: written in the same shape, checked against each other, in one graph.</text>
</svg>
